
services:
  postgres:
    image: postgres:17
    container_name: blindreview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blindreview
      POSTGRES_USER: blindreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blindreview_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindreview -d blindreview"]
      interval: 5s
      timeout: 3s
      retries: 10

  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: tidecloak-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password

volumes:
  blindreview_pgdata:
